{% extends "bidang/base_bidang.html" %}
{% block title %}Input Surat — {{ bidang.nama_pendek }}{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-8 py-8">
  <div class="mb-6">
    <p class="text-primary text-[10px] font-semibold tracking-widest uppercase mono mb-1">Input Otomatis</p>
    <h1 class="text-[22px] sm:text-[26px] font-extrabold text-ink">Unggah Surat Masuk</h1>
    <p class="text-muted text-[13px] mt-1">Upload PDF — sistem baca dan isi form secara otomatis. Periksa sebelum menyimpan.</p>
  </div>

  <div class="card p-5 mb-5">
    <form hx-post="/b/{{ bidang_id }}/input/proses" hx-target="#hasil-area" hx-swap="innerHTML"
          hx-encoding="multipart/form-data" hx-indicator="#spin-proses">
      <p class="text-[11px] font-semibold text-muted uppercase tracking-wide mb-2">Berkas PDF surat masuk</p>
      <input type="file" name="file" accept=".pdf" required
        class="block w-full text-[13px] text-muted border border-border rounded-lg cursor-pointer bg-surface
               file:mr-4 file:py-2.5 file:px-4 file:rounded-l-lg file:border-0
               file:bg-primary file:text-white file:text-[12px] file:font-semibold
               hover:file:bg-primary-dark file:cursor-pointer file:transition-colors">
      <button type="submit"
        class="mt-4 inline-flex items-center gap-2 bg-primary hover:bg-primary-dark text-white text-[13px] font-semibold px-6 py-2.5 rounded-lg transition-colors">
        <svg id="spin-proses" class="htmx-indicator animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/>
        </svg>
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
        </svg>
        Proses Surat
      </button>
    </form>
  </div>

  <div id="hasil-area"></div>
</div>
{% endblock %}
